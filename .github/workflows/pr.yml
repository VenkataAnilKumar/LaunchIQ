name: PR Checks

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - run: pip install ruff mypy
      - run: ruff check src/
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - run: pnpm install
      - run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r src/apps/api/requirements.txt
      - run: pytest src/ --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v4

  eval-gate:
    name: Eval Gate (Agent Quality)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r src/apps/api/requirements.txt
      - name: Eval gate (offline - fake LLM, no secrets needed)
        # Runs the real agents over the whole brief corpus against a deterministic fake LLM and
        # fails on schema/grounding/injection regressions. Live quality evals run on a schedule.
        run: python src/evals/regression/run_regression.py --offline --assert-baseline
